        <style>
            

            /* Hide the checkbox visually but keep it accessible */
            #toggle-dark-mode{position:absolute;left:-9999px}

            /* When checkbox is checked, override variables on the following .site wrapper */
            #toggle-dark-mode:checked ~ .site, .form-input:active{
                background-color: #0b0b10;
                color: #e6e6e6;
             }

            .site{
                background-color:white;
                color:black;
                margin: -1rem -1rem -1rem -1rem;
                transition: 180ms ease, color 180ms ease;
                padding:2.3rem;
                min-height:110vh;
                text-align: center;
            }

            /* Toggle label acts as the visible button */
            .toggle-label{
                position: absolute;
                top:1rem;
                right:1rem;
                background:transparbent;
                border:1px solid;
                padding:0.4rem 0.6rem;
                border-radius:6px;
                color: rgba(29, 199, 66, 0.908);
            }

            .form-input{
                margin: 0.5rem;
                padding: 0.5rem;
                border-radius: 4px;
                border: 1px solid #7e6161;
                width: 300px;
            }

            .form-input~[type="submit"]{
                background-color: #1dc742;
                color: white;
                border: none;
                cursor: pointer;
                width: 160px;
            }
.baseForm{
